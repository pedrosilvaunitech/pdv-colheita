name: Secret scan

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Varredura semanal do histórico completo (segunda, 06:00 UTC)
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks (código + histórico)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth 0 = histórico completo, necessário para varrer commits
          # antigos e não apenas o diff do push atual.
          fetch-depth: 0

      - name: Rodar Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
